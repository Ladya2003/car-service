name: Publish demo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/build.mjs', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static demo
        run: node scripts/build.mjs
        env:
          CAR_SERVICE_API_URL: https://amorely.onrender.com/api/car-service
          CAR_SERVICE_BASE_PATH: /car-service/
          CAR_SERVICE_SITE_URL: https://ladya2003.github.io/car-service
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: https://ladya2003.github.io/car-service/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
